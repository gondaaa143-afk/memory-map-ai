<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Map AI</title>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial}
.top{padding:20px;background:#121a33}
.btn{background:#2563eb;padding:14px;border-radius:12px;text-align:center;margin:20px;font-weight:bold}
.map{position:relative;height:420px}
.node{position:absolute;width:70px;height:70px;border-radius:50%;
background:#2563eb;display:flex;align-items:center;justify-content:center;
font-size:11px;box-shadow:0 0 20px #2563eb}
</style>
</head>
<body>

<div class="top">
<h2>Memory Map AI</h2>
<p>Your Second Brain</p>
</div>

<div class="btn">📄 Upload PDF</div>

<div class="map">
<div class="node" style="left:40%;top:40%">Polity</div>
<div class="node" style="left:15%;top:20%">Federalism</div>
<div class="node" style="left:68%;top:18%">Judiciary</div>
<div class="node" style="left:18%;top:68%">Governor</div>
<div class="node" style="left:68%;top:68%">Parliament</div>
</div>

<div style="padding:20px">
<h3>Memory Score: 62%</h3>
<p>Next revision in 3 days.</p>
</div>

</body>
</html>
